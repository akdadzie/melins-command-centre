<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C8102E" />
    <title>MeLiNS Command Centre</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app's code can't load at all (A-047), React never starts and no
      // error boundary can help, so show the message from here instead of a
      // blank page: when a script fails to load, or still nothing after 15 s.
      (function () {
        var shown = false
        function show() {
          var root = document.getElementById('root')
          if (shown || !root || root.childElementCount > 0) return
          shown = true
          root.innerHTML =
            '<section role="alert" style="font-family:system-ui,sans-serif;max-width:560px;margin:15vh auto;padding:1.25rem 1.5rem;' +
            'border:1px solid #e2e2e2;border-top:4px solid #C8102E;border-radius:6px;color:#2b2b2b">' +
            '<h1 style="font-size:1.4rem;margin:0 0 .5rem">Something went wrong</h1>' +
            '<p>The Command Centre couldn\'t start. Nothing you saved is lost.</p>' +
            '<p style="color:#6b6b6b;font-size:.9rem">Check your connection and reload. If it keeps happening, tell the Managing Director.</p>' +
            '<button onclick="location.reload()" style="min-height:44px;padding:0 1rem;border-radius:6px;border:1px solid #C8102E;' +
            'background:#C8102E;color:#fff;font:inherit;font-weight:600;cursor:pointer">Reload</button></section>'
        }
        window.addEventListener('error', function (e) {
          var t = e.target
          if (t && t.tagName === 'SCRIPT') show()   // a script failed to load
        }, true)
        window.addEventListener('unhandledrejection', function (e) {
          if (/import|module/i.test(String(e.reason && e.reason.message))) show()   // a failed module import
        })
        setTimeout(show, 15000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
